name: Cozy Loops CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t cozy-loops-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t cozy-loops-frontend ./frontend

      - name: Debug GitHub OIDC claims
        env:
          ACTIONS_ID_TOKEN_REQUEST_URL: ${{ env.ACTIONS_ID_TOKEN_REQUEST_URL }}
          ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${{ env.ACTIONS_ID_TOKEN_REQUEST_TOKEN }}
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ.get("TOKEN")

          if not token:
              print("Token not available")
              raise SystemExit(1)

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          print("iss:", claims.get("iss"))
          print("aud:", claims.get("aud"))
          print("sub:", claims.get("sub"))
          print("repository:", claims.get("repository"))
          print("ref:", claims.get("ref"))
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753523293777:role/CozyLoopsGitHubActionsRole
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag backend image
        run: |
          docker tag cozy-loops-backend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Push backend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Tag frontend image
        run: |
          docker tag cozy-loops-frontend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      - name: Push frontend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest