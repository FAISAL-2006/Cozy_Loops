name: Cozy Loops CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------
      # 3. Backend build
      # ----------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ----------------------------------------
      # 4. Frontend build
      # ----------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      # ----------------------------------------
      # 5. Build Docker images
      # ----------------------------------------
      - name: Build backend Docker image
        run: docker build -t cozy-loops-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t cozy-loops-frontend ./frontend

      # ----------------------------------------
      # 6. AWS credentials
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753523293777:role/CozyLoopsGitHubActionsRole
          aws-region: eu-north-1

      # ----------------------------------------
      # 7. Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # 8. Tag Docker images
      # ----------------------------------------
      - name: Tag backend image
        run: |
          docker tag cozy-loops-backend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Tag frontend image
        run: |
          docker tag cozy-loops-frontend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      # ----------------------------------------
      # 9. Push Docker images
      # ----------------------------------------
      - name: Push backend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Push frontend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      # ----------------------------------------
      # 10. Deploy to EC2 through SSM
      # ----------------------------------------
      - name: Deploy to EC2
        shell: bash
        run: |
          set -e

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids i-0b3656616e82f731f \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/cozy-loops",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 753523293777.dkr.ecr.eu-north-1.amazonaws.com",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for EC2 deployment..."

          # Give SSM a little time before the first status check
          sleep 5

          STATUS="Pending"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0b3656616e82f731f \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/60 - Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "========================================"
              echo "Deployment succeeded!"
              echo "========================================"
              break
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "TimedOut" ]]; then

              echo "========================================"
              echo "Deployment failed!"
              echo "========================================"

              echo ""
              echo "----- STDOUT -----"

              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id i-0b3656616e82f731f \
                --query "StandardOutputContent" \
                --output text || true

              echo ""
              echo "----- STDERR -----"

              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id i-0b3656616e82f731f \
                --query "StandardErrorContent" \
                --output text || true

              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "========================================"
            echo "Deployment polling timed out!"
            echo "========================================"

            echo "SSM Command ID: $COMMAND_ID"

            echo ""
            echo "Final command status:"

            aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0b3656616e82f731f \
              --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode}" \
              --output table || true

            exit 1
          fi

      # ----------------------------------------
      # 11. Verify production
      # ----------------------------------------
      - name: Verify production deployment
        run: |
          echo "Checking production..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            https://vm-yarncrafts.online/api/

          echo "========================================+"
          echo "Production health check passed!"
          echo "========================================+"