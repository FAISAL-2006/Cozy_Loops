name: Cozy Loops CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ----------------------------------------
      # 1. Checkout
      # ----------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ----------------------------------------
      # 2. Node.js
      # ----------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # ----------------------------------------
      # 3. Backend build
      # ----------------------------------------
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      # ----------------------------------------
      # 4. Frontend dependencies
      # ----------------------------------------
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # ----------------------------------------
      # 5. Verify frontend secrets
      # ----------------------------------------
      - name: Verify frontend environment
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          if [ -z "$VITE_GOOGLE_CLIENT_ID" ]; then
            echo "ERROR: VITE_GOOGLE_CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$VITE_API_URL" ]; then
            echo "ERROR: VITE_API_URL is missing"
            exit 1
          fi

          echo "VITE_GOOGLE_CLIENT_ID = SET"
          echo "VITE_API_URL = $VITE_API_URL"

      # ----------------------------------------
      # 6. Build frontend
      # ----------------------------------------
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      # ----------------------------------------
      # 7. Build backend Docker image
      # ----------------------------------------
      - name: Build backend Docker image
        run: |
          docker build \
            -t cozy-loops-backend \
            ./backend

      # ----------------------------------------
      # 8. Build frontend Docker image
      # ----------------------------------------
      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
            --build-arg VITE_API_URL="${{ secrets.VITE_API_URL }}" \
            -t cozy-loops-frontend \
            ./frontend

      # ----------------------------------------
      # 9. Configure AWS credentials
      # ----------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753523293777:role/CozyLoopsGitHubActionsRole
          aws-region: eu-north-1

      # ----------------------------------------
      # 10. Login to ECR
      # ----------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # ----------------------------------------
      # 11. Tag backend image
      # ----------------------------------------
      - name: Tag backend image
        run: |
          docker tag cozy-loops-backend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      # ----------------------------------------
      # 12. Tag frontend image
      # ----------------------------------------
      - name: Tag frontend image
        run: |
          docker tag cozy-loops-frontend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      # ----------------------------------------
      # 13. Push backend image
      # ----------------------------------------
      - name: Push backend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      # ----------------------------------------
      # 14. Push frontend image
      # ----------------------------------------
      - name: Push frontend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      # ----------------------------------------
      # 15. Deploy to EC2 through SSM
      # ----------------------------------------
      - name: Deploy to EC2
        shell: bash
        run: |
          set -e

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids i-0b3656616e82f731f \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/cozy-loops",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 753523293777.dkr.ecr.eu-north-1.amazonaws.com",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "Waiting for EC2 deployment..."

          sleep 5

          STATUS="Pending"

          for i in {1..60}; do

            STATUS=$(aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0b3656616e82f731f \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $i/60 - Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "========================================"
              echo "Deployment succeeded!"
              echo "========================================"
              break
            fi

            if [[ "$STATUS" == "Failed" ||
                  "$STATUS" == "Cancelled" ||
                  "$STATUS" == "TimedOut" ]]; then

              echo "========================================"
              echo "Deployment failed!"
              echo "========================================"

              echo ""
              echo "----- STDOUT -----"

              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id i-0b3656616e82f731f \
                --query "StandardOutputContent" \
                --output text || true

              echo ""
              echo "----- STDERR -----"

              aws ssm get-command-invocation \
                --region eu-north-1 \
                --command-id "$COMMAND_ID" \
                --instance-id i-0b3656616e82f731f \
                --query "StandardErrorContent" \
                --output text || true

              exit 1
            fi

            sleep 5
          done

          if [ "$STATUS" != "Success" ]; then
            echo "========================================"
            echo "Deployment polling timed out!"
            echo "========================================"

            echo "SSM Command ID: $COMMAND_ID"

            echo ""
            echo "Final command status:"

            aws ssm get-command-invocation \
              --region eu-north-1 \
              --command-id "$COMMAND_ID" \
              --instance-id i-0b3656616e82f731f \
              --query "{Status:Status,StatusDetails:StatusDetails,ResponseCode:ResponseCode}" \
              --output table || true

            exit 1
          fi

      # ----------------------------------------
      # 16. Verify production
      # ----------------------------------------
      - name: Verify production deployment
        run: |
          echo "Checking production..."

          curl \
            --fail \
            --silent \
            --show-error \
            --retry 10 \
            --retry-delay 5 \
            --retry-connrefused \
            https://vm-yarncrafts.online/api/

          echo "========================================"
          echo "Production health check passed!"
          echo "========================================"