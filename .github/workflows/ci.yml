name: Cozy Loops CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build backend Docker image
        run: docker build -t cozy-loops-backend ./backend

      - name: Build frontend Docker image
        run: docker build -t cozy-loops-frontend ./frontend

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::753523293777:role/CozyLoopsGitHubActionsRole
          aws-region: eu-north-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag backend image
        run: |
          docker tag cozy-loops-backend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Tag frontend image
        run: |
          docker tag cozy-loops-frontend:latest \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      - name: Push backend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-backend:latest

      - name: Push frontend image
        run: |
          docker push \
            753523293777.dkr.ecr.eu-north-1.amazonaws.com/cozy-loops-frontend:latest

      - name: Deploy to EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region eu-north-1 \
            --instance-ids i-0b3656616e82f731f \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ec2-user/cozy-loops",
              "aws ecr get-login-password --region eu-north-1 | docker login --username AWS --password-stdin 753523293777.dkr.ecr.eu-north-1.amazonaws.com",
              "docker compose pull",
              "docker compose up -d",
              "docker image prune -f"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b3656616e82f731f

          STATUS=$(aws ssm get-command-invocation \
            --region eu-north-1 \
            --command-id "$COMMAND_ID" \
            --instance-id i-0b3656616e82f731f \
            --query "Status" \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed!"
            exit 1
          fi

      - name: Verify production deployment
        run: |
          curl --fail --silent --show-error \
            https://vm-yarncrafts.online/api/

          echo "Production health check passed!"